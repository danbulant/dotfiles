font_family postscript_name=FiraCodeNF-Ret features=+zero
background_opacity 0.6
shell tmux new-session
remember_window_size no
#map ctrl+shift+c copy_to_clipboard
#map ctrl+shift+v paste_from_clipboard

include dank-tabs.conf

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style round
tab_activity_symbol *
tab_title_template "{index} {fmt.fg.color13}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title}"
#active_tab_foreground #ffffff
#active_tab_background #09BC8A
#inactive_tab_background #067555
#inactive_tab_foreground #dddddd
#color13 #D81E5B
#color11 #F7E733
#color2 #09BC8A
#color14 #75DDDD
# Keep tabs in tmux; forward these keys even when an application requests them.
map ctrl+shift+t send_text all \x1b[900~
map ctrl+shift+left send_text all \x1b[901~
map ctrl+shift+right send_text all \x1b[902~

include dank-theme.conf
